name: Graph Service

on:
  push:
    branches: [main]
    paths:
      - "graph-service/**"
      - ".github/workflows/graph-service.yml"
  pull_request:
    paths:
      - "graph-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall app

      - name: Run tests (if any)
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest -v
          else
            echo "No tests yet — skipping"
          fi