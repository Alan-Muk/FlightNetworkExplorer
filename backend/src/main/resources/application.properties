spring.application.name=backend

# H2 file database
spring.datasource.url=jdbc:h2:file:./data/flights
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update

# H2 console (dev only)
spring.h2.console.enabled=true

# Server
server.port=${PORT:8080}

# Import source files
airports.file=${AIRPORTS_FILE:../data/raw/airports.dat}
airlines.file=${AIRLINES_FILE:../data/raw/airlines.dat}
routes.file=${ROUTES_FILE:../data/raw/routes.dat}

# Graph service (Python)
graph.service.url=${GRAPH_SERVICE_URL:http://localhost:8000}
graph.service.connect-timeout=2s
graph.service.read-timeout=5s

# Logging
logging.level.com.backend=DEBUG